<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071017"><title>东京都2051 · 城市地图</title><link rel="stylesheet" href="./site.css"></head>
<body><main id="map-site"><p class="initial-loading" role="status">正在打开城市地图…</p></main><script type="module">import {mount} from './app.mjs';mount(document.getElementById('map-site')).catch(error=>{const box=document.getElementById('map-site');box.replaceChildren();const p=document.createElement('p');p.className='initial-loading';p.textContent='地图未能打开：'+error.message;const b=document.createElement('button');b.textContent='重新加载';b.onclick=()=>location.reload();p.append(b);box.append(p);});</script></body></html>
