<script>
document.addEventListener('DOMContentLoaded',()=>{
'use strict';
const {t,element:el}=CXXUI,node=id=>document.getElementById(id);
let status='loading', item=null;const workshop=CxxWorkshopDetail.create();
try {const ref=new URL(document.referrer);if(ref.origin===location.origin&&ref.pathname==='/workshop.html'){node('back').href=ref.pathname+ref.search;if(history.length>1)node('back').addEventListener('click',event=>{if(event.button===0&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey){event.preventDefault();history.back();}});}} catch{}
const labels={character:['NPC / 人物资料','NPC / Characters','NPC / 人物資料'],world_factor:['世界 / 地点资料','World / Places','世界 / 場所の資料'],user_identity:['玩家出身资料','Player backgrounds','プレイヤーの出自'],contract:['委托 / 侧剧情','Quests / Side stories','依頼 / サイドストーリー'],shop_item:['商店物品','Shop items','商品'],blueprint:['蓝图','Blueprints','設計図'],recipe:['配方','Recipes','レシピ'],skill:['技能','Skills','スキル'],function:['功能','Functions','機能'],code_component:['代码集成提案','Code integration proposal','コード統合提案']};
function render(){
 node('content').hidden=status!=='ready';node('retry').hidden=status!=='failed';
 if(status!=='ready'){node('title').textContent=status==='notfound'?t('投稿不存在或未公开','This creation is unavailable','作品が存在しないか非公開です'):status==='failed'?t('详情读取失败','Could not load the details','詳細を読み込めません'):t('读取中…','Loading…','読み込み中…');node('detail-state').textContent=status==='failed'?t('请检查连接后重试。','Check your connection and try again.','接続を確認して再試行してください。'):'';return;}
 const it=item;document.title=it.title+' · '+t('创意工坊','Workshop','工房');node('title').textContent=it.title;node('type').textContent=labels[it.type]?t(...labels[it.type]):it.type;node('detail-state').textContent='';
 node('meta').textContent=(it.authorName||t('匿名','Anonymous','匿名'))+' · '+t('修订 ','Revision ','改訂 ')+it.revision+' · '+t('更新于 ','Updated ','更新日 ')+String(it.updatedAt||'').slice(0,10);
 const tags=node('tags');tags.replaceChildren();for(const value of it.tags||[])tags.append(el('span','tag',value));
 node('summary').textContent=it.summary||t('暂无简介。','No summary provided.','紹介文はありません。');node('payload').textContent=JSON.stringify(it.payload,null,2);CxxSubmissionView.render(node('readable-content'),it.presentation);
 const how=node('howto');how.replaceChildren();
 if(it.type==='code_component')how.append(el('p','','这份历史代码提案由维护者审查并集成到后续角色卡。'));
 else {const steps=el('ol','');for(const step of ['打开酒馆卡或网页版中的「工坊」。','在浏览里订阅、下载所需内容，再选择「本存档启用」。','委托从终端接取；人设在创建新人物时选择。新版本由你手动切换。'])steps.append(el('li','',step));how.append(steps);if(!it.publication?.available)how.append(el('p','hint','当前目录暂未提供此作品的正式包。已启用的旧档继续使用保存的版本。'));}
 workshop.render(it);
 node('filebadge').hidden=!it.attachment;node('dlbox').hidden=!it.attachment;node('filebadge').textContent=t('含附件','Attachment','添付あり');
 if(it.attachment){const url=new URL(it.attachment.downloadUrl,location.href);if(['https:','http:'].includes(url.protocol)){node('dlbtn').href=url.href;node('dlbtn').textContent=t('下载附件：','Download: ','添付をダウンロード：')+(it.attachment.fileName||'file.'+it.attachment.fileExt);node('dlmeta').textContent=Math.round(it.attachment.fileSize/1024)+' KB';}else node('dlbox').hidden=true;}
}
async function load(){status='loading';render();const id=new URLSearchParams(location.search).get('id');if(!id||!/^\d+$/.test(id)){status='notfound';render();return;}try{const r=await fetch('/api/workshop/submissions/'+encodeURIComponent(id),{cache:'no-store'});if(r.status===404){status='notfound';}else{const j=await r.json();if(!r.ok||!j.ok||!j.item)throw Error('failed');item=j.item;status='ready';}}catch{status='failed';}render();}
node('retry').addEventListener('click',load);document.addEventListener('cxx-lang-changed',render);load();
});
</script></body></html>
