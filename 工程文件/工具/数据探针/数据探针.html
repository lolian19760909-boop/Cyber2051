<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>东京都2051 · 数据探针（P0）</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a0c; --panel: #16131a; --line: #3a3040; --ink: #ece7f0; --dim: #9c93a8; --hot: #f0c020; --ok: #46d18b; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; }

  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  h1 span { color: var(--hot); }
  .panel { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { border: 1px solid var(--line); background: #1d1822; color: var(--ink); padding: 8px 14px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--hot); }
  button.hot { border-color: var(--hot); color: var(--hot); }
  pre { margin: 0; padding: 10px; background: #0e0c11; border: 1px solid var(--line); overflow: auto; max-height: 320px; font-size: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--dim); }
  ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

</head>
<body>
<main>
  <h1>东京都2051 · <span>数据探针</span>（P0，不改产品码）</h1>
  <div class="panel">
    <div id="cap" class="dim">正在探测数据库接口…</div>
    <ol id="steps"></ol>
    <div class="row">
      <button class="hot" id="run">跑一轮（建表→写行→读回→删探针）</button>
      <button id="read">只读一次（看当前表与行数）</button>
      <button id="save">下载回执</button>
      <button id="copy">复制回执</button>
    </div>
  </div>
  <div class="panel">
    <div class="dim">手动两步（P0 第 4／5 项）：①在酒馆里切到别的 swipe／删掉一层楼；②回到这里点下面的按钮，对比指纹是否跟着变。</div>
    <div class="row">
      <button id="mark">记下当前指纹</button>
      <button id="diff">和上次记下的对比</button>
    </div>
    <pre id="state">（还没有记录）</pre>
  </div>
  <div class="panel">
    <div class="dim">原始回执</div>
    <pre id="log">（空白）</pre>
  </div>
</main>
<script>/*
 * 数据库探针核心（P0）
 *
 * 作用：在不改产品码的前提下，把「卡内脚本能不能用酒馆数据库插件」这件事
 * 变成一串可以复跑、可以留回执的检查。浏览器里给 数据探针.html 用，
 * Node 里给 测试/当前/data-probe.test.cjs 用（注入假宿主）。
 *
 * 不依赖任何库；不写产品状态（探针行写完会自己删掉）。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CxxDataProbe = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var TABLES = ['cxx_actor', 'cxx_actor_stat', 'cxx_inventory', 'cxx_equipment', 'cxx_item_def', 'cxx_fact', 'cxx_pending_tx', 'cxx_turn_index'];
  var PROBE_TABLE = 'cxx_fact';
  var PROBE_LIMIT = 8;

  function text(value) {
    return typeof value === 'string' ? value : '';
  }

  function chainOf(scope) {
    var chain = [];
    var frame = scope;
    for (var depth = 0; frame && depth < PROBE_LIMIT; depth++) {
      if (chain.indexOf(frame) >= 0) break;
      chain.push(frame);
      var next = null;
      try { next = frame.parent; } catch (error) { next = null; }
      if (!next || next === frame) {
        try { next = frame.top; } catch (error) { next = null; }
        if (!next || next === frame) break;
      }
      frame = next;
    }
    return chain;
  }

  function usable(api) {
    return !!api && typeof api.exportTableAsJson === 'function';
  }

  // 宿主窗口：卡内 iframe → parent → top，逐层找可用 API
  function hostOf(scope) {
    var chain = chainOf(scope || root);
    for (var i = 0; i < chain.length; i++) {
      var frame = chain[i];
      try {
        if (usable(frame.AutoCardUpdaterAPI)) return { host: frame, api: frame.AutoCardUpdaterAPI, depth: i };
      } catch (error) { /* 跨域，跳过 */ }
      try {
        var nested = frame.parent && frame.parent.AutoCardUpdaterAPI;
        if (usable(nested)) return { host: frame.parent, api: nested, depth: i + 1 };
      } catch (error) { /* 跨域，跳过 */ }
    }
    return { host: null, api: null, depth: -1 };
  }

  function detect(scope) {
    var found = hostOf(scope);
    var api = found.api;
    return {
      available: usable(api),
      depth: found.depth,
      capability: {
        export: typeof api?.exportTableAsJson === 'function',
        importTemplate: typeof api?.importTemplateFromData === 'function',
        insert: typeof api?.insertRow === 'function',
        update: typeof api?.updateRow === 'function',
        remove: typeof api?.deleteRow === 'function',
        restore: typeof api?.restoreTableAsJson === 'function'
      }
    };
  }

  function rawSheets(api) {
    var raw = api.exportTableAsJson();
    var list = [];
    if (!raw || typeof raw !== 'object') return list;
    Object.keys(raw).forEach(function (key) {
      if (!/^sheet_/.test(key)) return;
      var sheet = raw[key] || {};
      list.push({ key: key, name: text(sheet.name), sheet: sheet });
    });
    return list;
  }

  // 逻辑名（cxx_actor）→ 真实 sheet 键。优先级：模板中文名同名 → 逻辑名直出 sheet_cxx_* → uid 同名。
  function resolveKey(list, template, logical) {
    var sheet = (template || {})['sheet_' + logical] || {};
    var wanted = text(sheet.name);
    var hit = null;
    if (wanted) hit = list.find(function (item) { return item.name === wanted; });
    if (!hit) hit = list.find(function (item) { return item.key === 'sheet_' + logical; });
    if (!hit && wanted) hit = list.find(function (item) { return item.sheet && text(item.sheet.uid) === 'sheet_' + logical; });
    return hit || null;
  }

  function tablesOf(api, template) {
    var list = rawSheets(api);
    var out = {};
    TABLES.forEach(function (logical) {
      var hit = resolveKey(list, template, logical);
      if (!hit) return;
      var sheet = hit.sheet || {};
      var content = Array.isArray(sheet.content) ? sheet.content : [];
      var source = (template || {})['sheet_' + logical] || {};
      var labels = (Array.isArray(source.content) && source.content[0]) || (source.sourceData && Array.isArray(source.sourceData.content) && source.sourceData.content[0]) || [];
      out[logical] = {
        key: hit.key,
        name: hit.name,
        header: labels.length ? labels.slice() : (Array.isArray(content[0]) ? content[0] : []),
        content: content,
        rows: Math.max(0, content.length - 1)
      };
    });
    return out;
  }

  function fingerprint(tables) {
    var parts = TABLES.map(function (name) {
      var table = tables[name];
      return name + ':' + (table ? table.rows + '/' + table.header.length : 'absent');
    });
    return parts.join(';');
  }

  function ensure(api, template) {
    if (!template || template.mate?.type !== 'chatSheets') return { ok: false, reason: '模板不是 chatSheets' };
    if (typeof api.importTemplateFromData !== 'function') return { ok: false, reason: '宿主没有 importTemplateFromData' };
    api.importTemplateFromData(template, { scope: 'chat', dataMode: 'replace', conflictPolicy: 'overwrite' });
    var tables = tablesOf(api, template);
    var missing = TABLES.filter(function (name) { return !tables[name]; });
    var empty = TABLES.filter(function (name) { return tables[name] && !tables[name].header.length; });
    return { ok: !missing.length && !empty.length, missing: missing, emptyHeader: empty };
  }

  function findHeader(tables, table) {
    return tables[table] ? tables[table].header : [];
  }

  function ddlNames(ddl) {
    var names = [];
    if (!ddl) return names;
    var body = ddl.slice(ddl.indexOf('(') + 1, ddl.lastIndexOf(')'));
    body.split('\n').forEach(function (line) {
      var code = line.split('--')[0];
      var match = code.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s+[A-Za-z]/);
      if (match) names.push(match[1]);
    });
    return names;
  }

  // 表头是中文显示名，DDL 里才是字段名；两边都填上，宿主用哪套都能落库
  function rowFor(template, table, values, tables) {
    var sheet = template['sheet_' + table] || {};
    var labels = findHeader(tables, table);
    var names = ddlNames(sheet.sourceData && sheet.sourceData.ddl);
    var row = {};
    names.forEach(function (name, index) {
      if (index === 0) return;
      if (values[name] === undefined) return;
      row[name] = values[name];
      if (labels[index]) row[labels[index]] = values[name];
    });
    return row;
  }

  function writeProbe(api, template, tables, stamp) {
    var sheet = template['sheet_' + PROBE_TABLE] || {};
    var names = ddlNames(sheet.sourceData && sheet.sourceData.ddl);
    if (names.indexOf('fact_key') < 0) return { ok: false, reason: 'DDL 里没有 fact_key' };
    var row = rowFor(template, PROBE_TABLE, { fact_key: 'cxx-probe-' + stamp, turn_no: 0, kind: '其他', payload: '探针写入' }, tables);
    var target = tables[PROBE_TABLE];
    if (typeof api.insertRow === 'function') api.insertRow(target.key, row);
    else api.updateCell(target.key, target.rows, names[1], row.fact_key);
    var after = tablesOf(api, template);
    var raw = after[PROBE_TABLE] ? { content: after[PROBE_TABLE].content } : {};
    var content = Array.isArray(raw.content) ? raw.content : [];
    var hit = content.some(function (cells) { return Array.isArray(cells) && cells.indexOf('cxx-probe-' + stamp) >= 0; });
    return { ok: hit, rows: after[PROBE_TABLE] ? after[PROBE_TABLE].rows : 0 };
  }

  function clearProbe(api, template, tables, stamp) {
    var sheet = template['sheet_' + PROBE_TABLE] || {};
    var names = ddlNames(sheet.sourceData && sheet.sourceData.ddl);
    var index = names.indexOf('fact_key');
    if (index < 0 || typeof api.deleteRow !== 'function') return { ok: false, reason: '无法删除探针行' };
    var current = tablesOf(api, template)[PROBE_TABLE];
    var content = current ? current.content : [];
    var target = -1;
    for (var i = 1; i < content.length; i++) {
      var cells = content[i];
      if (Array.isArray(cells) && cells.indexOf('cxx-probe-' + stamp) >= 0) { target = i - 1; break; }
    }
    if (target < 0) return { ok: false, reason: '没有找到探针行' };
    api.deleteRow(PROBE_TABLE, target);
    var after = tablesOf(api, template);
    var left = (api.exportTableAsJson()['sheet_' + PROBE_TABLE] || {}).content || [];
    var gone = !left.some(function (cells) { return Array.isArray(cells) && cells.indexOf('cxx-probe-' + stamp) >= 0; });
    return { ok: gone, rows: after[PROBE_TABLE] ? after[PROBE_TABLE].rows : 0 };
  }

  function run(scope, template, options) {
    var opts = options || {};
    var stamp = opts.stamp || String(Date.now());
    var steps = [];
    var push = function (id, ok, detail) { steps.push({ id: id, ok: !!ok, detail: detail === undefined ? '' : detail }); return ok; };

    var found = detect(scope);
    push('capability', found.available, found.available ? (found.depth ? '向上第 ' + found.depth + ' 层窗口找到数据库接口' : '本页就有数据库接口') : '没有找到 AutoCardUpdaterAPI（插件未装或不可达）');
    if (!found.available) return { stamp: stamp, steps: steps, pass: false, fingerprint: '' };

    var api = hostOf(scope).api;
    var before = tablesOf(api, template);
    var fingerprintBefore = fingerprint(before);
    push('read-first', true, Object.keys(before).length + ' 张表');

    var ensured = ensure(api, template);
    push('ensure', ensured.ok, ensured.ok ? '8 张表就位' : JSON.stringify(ensured));

    var tables = tablesOf(api, template);
    var wrote = writeProbe(api, template, tables, stamp);
    push('write', wrote.ok, wrote.ok ? '写入 1 行' : JSON.stringify(wrote));

    var afterWrite = tablesOf(api, template);
    push('read-back', afterWrite[PROBE_TABLE] && afterWrite[PROBE_TABLE].rows >= 1, 'fact 行数 ' + (afterWrite[PROBE_TABLE] || {}).rows);

    var cleared = clearProbe(api, template, tables, stamp);
    push('cleanup', cleared.ok, cleared.ok ? '探针行已删除' : JSON.stringify(cleared));

    var afterAll = fingerprint(tablesOf(api, template));
    push('fingerprint', true, afterAll);
    return {
      stamp: stamp,
      steps: steps,
      pass: steps.every(function (step) { return step.ok; }),
      fingerprint: afterAll
    };
  }

  return { TABLES: TABLES, PROBE_TABLE: PROBE_TABLE, chainOf: chainOf, hostOf: hostOf, detect: detect, tablesOf: tablesOf, fingerprint: fingerprint, ensure: ensure, run: run };
});
</script>

<script>
(function () {
  const P = window.CxxDataProbe;
  const tpl = JSON.parse(document.getElementById('cxx-template').textContent);
  const capEl = document.getElementById('cap');
  const stepsEl = document.getElementById('steps');
  const logEl = document.getElementById('log');
  const stateEl = document.getElementById('state');
  const KEY = 'cxx-probe-receipt';

  function line(step) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="' + (step.ok ? 'ok' : 'bad') + '">' + (step.ok ? '✔' : '✘') + '</span> '
      + step.id + ' <span class="dim">' + String(step.detail || '') + '</span>';
    return li;
  }
  function paint(report) {
    stepsEl.innerHTML = '';
    (report.steps || []).forEach(step => stepsEl.appendChild(line(step)));
    logEl.textContent = JSON.stringify(report, null, 2);
    try { localStorage.setItem(KEY, JSON.stringify(report)); } catch (e) {}
  }
  const found = P.detect(window);
  function paintCap() {
    const now = P.detect(window);
    capEl.innerHTML = now.available
      ? '<span class="ok">✔ 找到数据库接口</span>（' + (now.depth ? '向上 ' + now.depth + ' 层窗口' : '就在本页') + '）· ' + JSON.stringify(now.capability)
      : '<span class="bad">✘ 没找到数据库接口</span>：确认数据库插件已安装并刷新；卡内 iframe 里遇到这句属于预期，请把本页放在酒馆主界面打开一次。';
  }
  paintCap();
  document.getElementById('run').onclick = () => { paint(P.run(window, tpl)); paintCap(); };
  document.getElementById('read').onclick = () => {
    const api = P.hostOf(window).api;
    if (!api) { capEl.className = 'bad'; return; }
    const tables = P.tablesOf(api);
    stateEl.textContent = JSON.stringify({ fingerprint: P.fingerprint(tables), tables }, null, 2);
  };
  document.getElementById('mark').onclick = () => {
    const api = P.hostOf(window).api;
    if (!api) return;
    localStorage.setItem('cxx-probe-mark', P.fingerprint(P.tablesOf(api)));
    stateEl.textContent = '已记下：' + localStorage.getItem('cxx-probe-mark');
  };
  document.getElementById('diff').onclick = () => {
    const api = P.hostOf(window).api;
    if (!api) return;
    const mark = localStorage.getItem('cxx-probe-mark') || '（没有记过）';
    const now = P.fingerprint(P.tablesOf(api));
    stateEl.textContent = '上次：' + mark + '\n现在：' + now + '\n' + (mark === now ? '完全一致（说明这次操作没有改表）' : '有变化（分支/楼层切换确实换了表内容）');
  };
  document.getElementById('copy').onclick = async () => {
    const text = logEl.textContent;
    try { await navigator.clipboard.writeText(text); } catch (e) { stateEl.textContent = '复制失败，请手动选中上面的文本'; }
  };
  document.getElementById('save').onclick = () => {
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const blob = new Blob([logEl.textContent], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cxx-data-probe-' + stamp + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };

  // 刷新后对比：上一次回执存着，这次进来先看一眼指纹变没变
  try {
    const prev = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (prev && prev.fingerprint) stateEl.textContent = '上次回执指纹：' + prev.fingerprint;
  } catch (e) {}
})();
</script>
