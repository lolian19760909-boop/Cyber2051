<style>
/* 2051 红黑档案终端皮肤（夜间流式轻量版）—— 色值对齐 theme/status.css */
/* 基础字体设置 */
.konata-thinking-wrapper {
    display: block;
    margin: 12px 0;
    font-family: 'Bahnschrift', 'Arial Narrow', 'Noto Sans SC', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* 主容器：墨黑毛玻璃 */
.konata-thinking-details {
    background: rgba(9, 8, 11, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid #59262a;
    border-radius: 2px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

/* 展开状态：加深背景，红色高亮边框 */
.konata-thinking-details[open] {
    background: rgba(5, 4, 6, 0.88);
    border-color: rgba(220, 92, 89, 0.55);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
}

/* 标题栏 */
.konata-thinking-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    color: #f08278;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
}

/* 隐藏默认三角 */
.konata-thinking-summary::-webkit-details-marker {
    display: none;
}

/* 标题内容区 */
.konata-title-content {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 图标旋转 */
.konata-icon {
    display: inline-block;
    transition: transform 0.3s ease;
    color: #dc5c59;
}
.konata-thinking-details[open] .konata-icon {
    transform: rotate(90deg);
    color: #f08278;
}

/* 展开箭头（青=可交互） */
.konata-arrow {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: transform 0.3s ease;
    color: #6ecbd0;
}
.konata-arrow::after {
    content: '';
    width: 6px;
    height: 6px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-1px, -1px);
}
.konata-thinking-details[open] .konata-arrow {
    transform: rotate(180deg);
    opacity: 1;
}

/* 内容区域：保留滚动条与正确换行 */
.konata-thinking-content {
    padding: 12px 16px 16px;
    color: #d2d5d4;
    font-size: 13.5px;
    line-height: 1.6;
    border-top: 1px solid rgba(220, 92, 89, 0.18);
    max-height: 350px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    animation: konataFadeIn 0.3s ease;
    white-space: pre-wrap;       /* 核心修复：保留空格和换行符 */
    overflow-wrap: break-word;   /* 核心修复：防止长单词溢出 */
    word-break: break-word;      /* 兼容性增强 */
}

@keyframes konataFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 滚动条样式 */
.konata-thinking-content::-webkit-scrollbar {
    width: 4px;
}
.konata-thinking-content::-webkit-scrollbar-thumb {
    background: rgba(220, 92, 89, 0.45);
    border-radius: 0;
}

/* Markdown 元素样式 */
.konata-thinking-content p { margin: 8px 0; }
.konata-thinking-content code {
    background: rgba(0, 0, 0, 0.35);
    color: #6ecbd0;
    padding: 2px 5px;
    border-radius: 2px;
    font-family: 'Consolas', 'Noto Sans SC', monospace;
    font-size: 0.9em;
}
.konata-thinking-content pre {
    background: rgba(0, 0, 0, 0.4);
    padding: 10px;
    border-radius: 2px;
    border: 1px solid #59262a;
    overflow-x: auto;
    white-space: pre; /* 代码块内部保持原有格式 */
}
</style>

<div class="konata-thinking-wrapper">
    <details class="konata-thinking-details">
        <summary class="konata-thinking-summary">
            <span class="konata-title-content">
                <span class="konata-icon">◆</span>
                <span>小此思考中...</span>
            </span>
            <span class="konata-arrow"></span>
        </summary>
        <div class="konata-thinking-content">$1</div>
    </details>
</div>
