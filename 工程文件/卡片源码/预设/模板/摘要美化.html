<style>.k-sum-w{display:inline-block;margin:4px 8px 4px 0;vertical-align:top;font-family:'Bahnschrift','Arial Narrow','Noto Sans SC',sans-serif}.k-sum-s{list-style:none;width:24px;height:24px;border-radius:2px;background:linear-gradient(135deg,#1d1013,#120a0d);border:1px solid #59262a;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}.k-sum-s::-webkit-details-marker{display:none}.k-sum-s:hover{transform:translateY(-1px);border-color:#6ecbd0;box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 8px rgba(110,203,208,.25)}.k-sum-i{font-size:12px;color:#dc5c59;text-shadow:0 0 6px rgba(220,92,89,.45);line-height:1}.k-sum-c{display:block;margin-top:8px;padding:10px 14px;background:linear-gradient(135deg,rgba(18,10,13,.98),rgba(13,8,10,.98));backdrop-filter:blur(4px);border:1px solid #59262a;border-radius:2px;font-size:13px;line-height:1.5;color:#d2d5d4;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 2px 0 rgba(220,92,89,.42);animation:k-fd .3s cubic-bezier(.4,0,.2,1);position:relative;white-space:pre-wrap;min-width:300px}.k-sum-c::before{content:'';position:absolute;top:-7px;left:8px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:7px solid #59262a}@keyframes k-fd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}</style><div class="k-sum-w"><details><summary class="k-sum-s" title="点击展开剧情摘要"><span class="k-sum-i">◆</span></summary><div class="k-sum-c">$1</div></details></div>
