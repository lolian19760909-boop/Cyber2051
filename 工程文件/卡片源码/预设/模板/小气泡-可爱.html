<style>
/* 2051 红黑档案终端皮肤 —— 色值对齐 theme/status.css（红=强调，青=交互） */
.tucao-w{display:inline-block;margin:4px 8px 4px 0;vertical-align:top;font-family:'Bahnschrift','Arial Narrow','Noto Sans SC',sans-serif}
.tucao-s{display:inline-flex;align-items:center;justify-content:center;list-style:none;cursor:pointer;width:24px;height:24px;background:linear-gradient(135deg,#1d1013,#120a0d);border-radius:2px;transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;border:1px solid #59262a;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tucao-s::-webkit-details-marker{display:none}
.tucao-s:hover{transform:translateY(-1px);border-color:#6ecbd0;box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 8px rgba(110,203,208,.25)}
.tucao-s:active{transform:translateY(0)}
.tucao-i{font-size:12px;color:#dc5c59;text-shadow:0 0 6px rgba(220,92,89,.45)}
.tucao-d[open]>.tucao-s{background:#173238;border-color:#6ecbd0;box-shadow:0 0 8px rgba(110,203,208,.3)}
.tucao-c{margin-top:8px;background:linear-gradient(135deg,rgba(18,10,13,.98),rgba(13,8,10,.98));backdrop-filter:blur(10px);border:1px solid #59262a;border-radius:2px;padding:14px 18px;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 2px 0 rgba(220,92,89,.42);animation:konataSlide .3s cubic-bezier(.4,0,.2,1);position:relative;min-width:300px}
.tucao-c::before{content:'';position:absolute;top:-7px;left:8px;width:12px;height:12px;background:rgba(18,10,13,.98);border-left:1px solid #59262a;border-top:1px solid #59262a;transform:rotate(45deg)}
.tucao-h{color:#f08278;font-weight:700;font-size:13px;margin-bottom:10px;text-transform:none;letter-spacing:1px;border-bottom:1px solid #59262a;padding-bottom:7px}
.tucao-t{white-space:pre-wrap;word-wrap:break-word;font-size:13.5px;color:#d2d5d4;line-height:1.5;max-height:350px;overflow-y:auto;padding-right:6px}
.tucao-t p{margin:8px 0}
.tucao-t p:first-child{margin-top:0}
.tucao-t p:last-child{margin-bottom:0}
.tucao-t strong{font-weight:700;color:#f08278}
.tucao-t em{font-style:italic;opacity:.95;color:#d8a748}
.tucao-t code{background:rgba(110,203,208,.08);color:#6ecbd0;padding:2px 7px;border-radius:2px;font-size:12.5px;font-family:'Consolas','Noto Sans SC',monospace;border:1px solid rgba(110,203,208,.22)}
.tucao-t pre{background:#0a0709;border-left:3px solid #dc5c59;padding:10px 12px;border-radius:2px;overflow-x:auto;margin:10px 0}
.tucao-t pre code{background:none;padding:0;font-size:12px;border:none}
.tucao-t a{color:#6ecbd0;text-decoration:none;border-bottom:1px solid rgba(110,203,208,.35);transition:all .2s;font-weight:600}
.tucao-t a:hover{color:#8fd9dd;border-bottom-color:#8fd9dd}
.tucao-t ul,.tucao-t ol{margin:8px 0;padding-left:22px}
.tucao-t li{margin:4px 0;position:relative}
.tucao-t li::marker{color:#dc5c59}
.tucao-t blockquote{border-left:3px solid rgba(220,92,89,.6);background:rgba(220,92,89,.06);padding:8px 12px;margin:10px 0;border-radius:0 2px 2px 0;font-style:italic;color:#a4a8aa}
.tucao-t::-webkit-scrollbar{width:6px}
.tucao-t::-webkit-scrollbar-track{background:rgba(89,38,42,.35);border-radius:0}
.tucao-t::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ae4545,#dc5c59);border-radius:0}
.tucao-t::-webkit-scrollbar-thumb:hover{background:#f08278}
@keyframes konataSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
</style><div class="tucao-w"><details class="tucao-d"><summary class="tucao-s"><span class="tucao-i">◆</span></summary><div class="tucao-c"><div class="tucao-h">🎮 此方的脑内剧场</div><div class="tucao-t">$1</div></div></details></div>
