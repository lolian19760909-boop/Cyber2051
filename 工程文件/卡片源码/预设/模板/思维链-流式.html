<style>
/* 2051 红黑档案终端皮肤 —— 色值对齐 theme/status.css（红=强调，青=交互，琥珀=提示） */
/* 最外层容器 */
.konata-thinking-wrapper {
    display: block;
    margin: 10px 0;
    font-family: 'Bahnschrift', 'Arial Narrow', 'Noto Sans SC', sans-serif;
}

/* details 主容器：墨黑面板 + 28px 暗红细网格 + 左侧红条 */
.konata-thinking-details {
    background-color: #120a0d;
    background-image: linear-gradient(rgba(220, 92, 89, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(220, 92, 89, .04) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid #59262a;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: inset 2px 0 rgba(220, 92, 89, .42), 0 10px 26px rgba(0, 0, 0, .4);
    transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
    position: relative;
}

.konata-thinking-details:hover {
    transform: translateY(-1px);
    border-color: #6ecbd0;
}

.konata-thinking-details[open] {
    box-shadow: inset 2px 0 rgba(220, 92, 89, .42), 0 14px 34px rgba(0, 0, 0, .5);
}

/* 气泡背景容器 */
.konata-particles-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.konata-thinking-details[open] .konata-particles-bg {
    opacity: 1;
}

/* 气泡样式 */
.konata-bubble {
    position: absolute;
    bottom: -150px;
    border-radius: 50%;
    opacity: 0;
    will-change: transform, opacity;
    animation: konataRise 15s linear infinite;
    filter: blur(1px);
}

@keyframes konataRise {
    0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
    10% { opacity: 0.7; }
    50% { transform: translate3d(var(--sway-x, 20px), -50vh, 0) scale(1.1); opacity: 0.9; }
    90% { opacity: 0.4; }
    100% { transform: translate3d(var(--sway-x-end, -20px), -110vh, 0) scale(0.6); opacity: 0; }
}

/* summary 标题栏：红黑渐变标题块（Animus 黑色标题块的 2051 等价物） */
.konata-thinking-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 18px;
    background: linear-gradient(90deg, #291116, #170b0f);
    border-bottom: 1px solid #59262a;
    cursor: pointer;
    user-select: none;
    list-style: none;
    position: relative;
    z-index: 2;
    overflow: hidden;
    transition: background-color 0.3s ease;
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2px;
}

.konata-thinking-summary::-webkit-details-marker,
.konata-thinking-summary::marker {
    display: none;
}

.konata-thinking-summary:hover {
    background: linear-gradient(90deg, #321318, #1c0d12);
}

/* 标题栏红色扫描光（terminal 的 cp-status-scan，本预设命名版） */
.konata-thinking-summary::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 35%;
    height: 100%;
    pointer-events: none;
    opacity: 0.2;
    background: linear-gradient(90deg, transparent, rgba(220, 92, 89, .32), transparent);
    animation: konata-cp-scan 15s linear infinite;
}

@keyframes konata-cp-scan {
    from { transform: translateX(-150%); }
    to { transform: translateX(400%); }
}

/* 标题文字部分 */
.konata-title-content {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 1;
}

/* 跳动的菱形标记 */
.konata-heart {
    display: inline-block;
    font-size: 14px;
    color: #dc5c59;
    text-shadow: 0 0 8px rgba(220, 92, 89, .5);
    animation: konataHeartbeat 1.5s ease-in-out infinite;
}

@keyframes konataHeartbeat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.2); }
    20% { transform: scale(1); }
    30% { transform: scale(1.15); }
    40% { transform: scale(1); }
}

/* 展开/收起指示（青=可交互） */
.konata-thinking-summary::after {
    content: '⌄';
    font-size: 24px;
    font-weight: 300;
    color: #6ecbd0;
    transition: transform 0.3s ease, color 0.3s ease;
    line-height: 1;
}

.konata-thinking-summary:hover::after {
    color: #8fd9dd;
}

.konata-thinking-details[open] .konata-thinking-summary::after {
    transform: rotate(180deg);
    color: #8fd9dd;
}

/* 内容区域 - 完整的 Markdown 样式支持 */
.konata-thinking-content {
    position: relative;
    z-index: 2;
    padding: 14px 18px;
    max-height: 350px;
    overflow-y: auto;
    overflow-x: hidden;
    color: #d2d5d4;
    font-size: 13.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: konataSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes konataSlideIn {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Markdown 段落 */
.konata-thinking-content p {
    margin: 8px 0;
}
.konata-thinking-content p:first-child {
    margin-top: 0;
}
.konata-thinking-content p:last-child {
    margin-bottom: 0;
}

/* 粗体 = 红系强调 */
.konata-thinking-content strong {
    font-weight: 700;
    color: #f08278;
}

/* 斜体 = 琥珀提示 */
.konata-thinking-content em {
    font-style: italic;
    opacity: 0.95;
    color: #d8a748;
}

/* 行内代码 = 数据终端字 */
.konata-thinking-content code {
    background: rgba(110, 203, 208, 0.08);
    color: #6ecbd0;
    padding: 2px 7px;
    border-radius: 2px;
    font-size: 12.5px;
    font-family: 'Consolas', 'Noto Sans SC', monospace;
    border: 1px solid rgba(110, 203, 208, 0.22);
}

/* 代码块 = 左侧红条的强调块 */
.konata-thinking-content pre {
    background: #0a0709;
    border-left: 3px solid #dc5c59;
    padding: 10px 12px;
    border-radius: 2px;
    overflow-x: auto;
    margin: 10px 0;
}

.konata-thinking-content pre code {
    background: none;
    padding: 0;
    font-size: 12px;
    border: none;
}

/* 链接 = 青色交互 */
.konata-thinking-content a {
    color: #6ecbd0;
    text-decoration: none;
    border-bottom: 1px solid rgba(110, 203, 208, 0.35);
    transition: all 0.2s;
    font-weight: 600;
}

.konata-thinking-content a:hover {
    color: #8fd9dd;
    border-bottom-color: #8fd9dd;
}

/* 列表 */
.konata-thinking-content ul,
.konata-thinking-content ol {
    margin: 8px 0;
    padding-left: 22px;
}

.konata-thinking-content li {
    margin: 4px 0;
    position: relative;
}

.konata-thinking-content li::marker {
    color: #dc5c59;
}

/* 引用块 = 左侧红条 */
.konata-thinking-content blockquote {
    border-left: 3px solid rgba(220, 92, 89, 0.6);
    background: rgba(220, 92, 89, 0.06);
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 0 2px 2px 0;
    font-style: italic;
    color: #a4a8aa;
}

/* 标题 */
.konata-thinking-content h1,
.konata-thinking-content h2,
.konata-thinking-content h3,
.konata-thinking-content h4,
.konata-thinking-content h5,
.konata-thinking-content h6 {
    color: #f08278;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 12px 0 8px 0;
    border-bottom: 1px solid #59262a;
    padding-bottom: 5px;
}

.konata-thinking-content h1 { font-size: 18px; }
.konata-thinking-content h2 { font-size: 16px; }
.konata-thinking-content h3 { font-size: 15px; }
.konata-thinking-content h4 { font-size: 14px; }

/* 水平线 */
.konata-thinking-content hr {
    border: none;
    border-top: 1px solid #59262a;
    margin: 15px 0;
}

/* 滚动条美化（方角，红系） */
.konata-thinking-content::-webkit-scrollbar {
    width: 6px;
}

.konata-thinking-content::-webkit-scrollbar-track {
    background: rgba(89, 38, 42, 0.35);
    border-radius: 0;
}

.konata-thinking-content::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #ae4545, #dc5c59);
    border-radius: 0;
    transition: background 0.2s;
}

.konata-thinking-content::-webkit-scrollbar-thumb:hover {
    background: #f08278;
}

/* 移动端适配 */
@media (max-width: 480px) {
    .konata-thinking-summary {
        padding: 14px 18px;
        font-size: 14px;
    }
    .konata-thinking-content {
        max-height: 300px;
        padding: 12px 15px;
        font-size: 13px;
    }
}

/* 减弱动画 */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
    .konata-bubble,
    .konata-heart {
        animation: none !important;
    }
    .konata-thinking-summary::before {
        animation: none !important;
    }
}
</style>

<div class="konata-thinking-wrapper">
    <details class="konata-thinking-details">
        <div class="konata-particles-bg"></div>
        <summary class="konata-thinking-summary">
            <span class="konata-title-content">
                <span class="konata-heart">◆</span>
                <span>小此在思考✨</span>
            </span>
        </summary>
        <div class="konata-thinking-content">$1</div>
    </details>
</div>

<script>
(function() {
    var CONFIG = {
        bubbleInterval: 400,
        bubbleSizeMin: 20,
        bubbleSizeMax: 90,
        bubbleDurationMin: 10,
        bubbleDurationMax: 18,
        bubbleColors: [
            'rgba(220, 92, 89, 0.55)',
            'rgba(110, 203, 208, 0.4)',
            'rgba(216, 167, 72, 0.35)'
        ]
    };

    var bubbleIntervalId = null;

    function createBubble(particlesBg) {
        var bubble = document.createElement('div');
        bubble.className = 'konata-bubble';

        var size = Math.random() * (CONFIG.bubbleSizeMax - CONFIG.bubbleSizeMin) + CONFIG.bubbleSizeMin;
        var duration = Math.random() * (CONFIG.bubbleDurationMax - CONFIG.bubbleDurationMin) + CONFIG.bubbleDurationMin;
        var color = CONFIG.bubbleColors[Math.floor(Math.random() * CONFIG.bubbleColors.length)];
        var swayX = (Math.random() - 0.5) * 120;
        var swayXEnd = (Math.random() - 0.5) * 120;

        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = (Math.random() * 100) + '%';
        bubble.style.background = 'radial-gradient(circle at 35% 35%, ' + color + ', transparent 65%)';
        bubble.style.animationDuration = duration + 's';
        bubble.style.animationDelay = (Math.random() * 2) + 's';
        bubble.style.setProperty('--sway-x', swayX + 'px');
        bubble.style.setProperty('--sway-x-end', swayXEnd + 'px');

        particlesBg.appendChild(bubble);

        setTimeout(function() {
            if (bubble.parentNode) {
                bubble.parentNode.removeChild(bubble);
            }
        }, (duration + 3) * 1000);
    }

    function init() {
        var details = document.querySelector('.konata-thinking-details');
        var particlesBg = document.querySelector('.konata-particles-bg');
        
        if (!details || !particlesBg) {
            setTimeout(init, 200);
            return;
        }

        if (details.hasAttribute('data-konata-init')) return;
        details.setAttribute('data-konata-init', 'true');

        details.addEventListener('toggle', function() {
            if (details.open) {
                if (!bubbleIntervalId) {
                    bubbleIntervalId = setInterval(function() {
                        createBubble(particlesBg);
                    }, CONFIG.bubbleInterval);
                }
            } else {
                if (bubbleIntervalId) {
                    clearInterval(bubbleIntervalId);
                    bubbleIntervalId = null;
                }
            }
        });
    }

    setTimeout(init, 100);
    setTimeout(init, 500);
    setTimeout(init, 1000);
})();
</script>
