<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>body {
  font-family: var(--cxx-font-ui);
}

.ae-wrap {
  position: relative;
  max-width: 680px;
  margin: 10px auto;
  --cp-ink: var(--cxx-ink);
  --cp-panel: var(--cxx-panel);
  --cp-panel-hi: var(--cxx-raised);
  --cp-line: var(--cxx-line);
  --cp-cyan: var(--cxx-cyan);
  --cp-red: var(--cxx-red);
  --cp-amber: var(--cxx-yellow);
  --cp-text: var(--cxx-text);
  --cp-muted: var(--cxx-muted);
  font-family: var(--cxx-font-ui);
  color: var(--cp-text);
}

.ae-paper {
  position: relative;
  padding: 40px 45px 45px 45px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% -18%,color-mix(in srgb, var(--cxx-narrative-panel) 50%, transparent),transparent 62%),repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb, var(--cxx-red) 2.20%, transparent) 31px 32px),var(--cp-ink);
  border: 1px solid var(--cp-line);
  border-radius: 2px;
  box-shadow: 0 18px 46px color-mix(in srgb, var(--cxx-shadow) 42%, transparent),inset 0 1px color-mix(in srgb, var(--cxx-red) 18.00%, transparent);
}

.ae-paper::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-size: 20px 20px;
  pointer-events: none;
  z-index: 0;
  background-image: linear-gradient(color-mix(in srgb, var(--cxx-red) 5.00%, transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb, var(--cxx-red) 5.00%, transparent) 1px,transparent 1px);
}

.ae-holes {
  position: absolute;
  left: 15px;
  top: 20px;
  bottom: 20px;
  width: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  z-index: 1;
}

.ae-hole {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cp-ink);
  box-shadow: inset 1px 1px 3px color-mix(in srgb, var(--cxx-shadow) 80%, transparent),0 0 0 1px var(--cp-line);
}

.ae-content {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.ae-header {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--cp-line);
}

.ae-num {
  font-size: 28px;
  font-weight: 600;
  line-height: 1;
  color: var(--cp-red);
  font-family: var(--cxx-font-mono);
}

.ae-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 2px;
  margin-bottom: 3px;
  color: var(--cp-text);
}

.ae-tag {
  margin-left: auto;
  padding: 4px 12px;
  font-size: 12px;
  letter-spacing: 1px;
  background: color-mix(in srgb, var(--cxx-cyan) 8.00%, transparent);
  color: var(--cp-cyan);
  border: 1px solid var(--cp-line);
  border-radius: 2px;
}

.ae-body {
  display: flex;
  gap: 30px;
  align-items: flex-start;
}

.ae-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.ae-text {
  font-size: 14px;
  line-height: 2;
  letter-spacing: 0.5px;
  text-align: justify;
  color: var(--cp-text);
}

.ae-gif-box {
  display: inline-block;
  padding: 6px;
  align-self: flex-start;
  transform: rotate(-2deg);
  background: var(--cp-panel-hi);
  border: 1px solid var(--cp-line);
  border-radius: 2px;
  box-shadow: none;
}

.ae-gif-box img {
  width: 80px;
  height: auto;
  display: block;
  filter: saturate(.78) contrast(1.05);
  border-radius: 1px;
}

.ae-right {
  width: 220px;
  flex-shrink: 0;
  position: relative;
}

.ae-polaroid {
  padding: 10px 10px 35px 10px;
  transform: rotate(3deg);
  transition: transform 0.3s ease;
  background: var(--cp-panel-hi);
  border: 1px solid var(--cp-line);
  border-radius: 2px;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--cxx-shadow) 35%, transparent);
  padding-bottom: 30px;
}

.ae-polaroid:hover {
  transform: rotate(0deg) scale(1.02);
}

.ae-polaroid img {
  display: block;
  border: 1px solid var(--cxx-line);
  width: 100%;
  height: 300px;
  object-fit: cover;
  object-position: top;
  filter: saturate(.78) contrast(1.05);
  border-radius: 1px;
}

.ae-polaroid-text {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
  color: var(--cp-cyan);
  bottom: 8px;
  font-family: var(--cxx-font-mono);
}

.ae-tape {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%) rotate(-4deg);
  border-left: 2px dashed color-mix(in srgb, var(--cxx-red-soft) 50.00%, transparent);
  border-right: 2px dashed color-mix(in srgb, var(--cxx-red-soft) 50.00%, transparent);
  z-index: 10;
  backdrop-filter: blur(2px);
  background: var(--cp-red);
  height: 2px;
  width: 56px;
  border: none;
  box-shadow: none;
  border-radius: 0;
}

.ae-btn {
  margin-top: auto;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  color: var(--cp-ink);
  background: var(--cp-cyan);
  border: 1px solid var(--cp-cyan);
  border-radius: 2px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--cxx-cyan) 22.00%, transparent);
  text-shadow: none;
}

.ae-btn:hover {
  transform: translateY(-2px);
  background: var(--cxx-cyan);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--cxx-cyan) 12.00%, transparent),0 6px 20px color-mix(in srgb, var(--cxx-cyan) 15.00%, transparent);
  color: var(--cp-ink);
}

.ae-btn:active {
  transform: translateY(1px);
  box-shadow: 0 2px 6px color-mix(in srgb, var(--cxx-red-soft) 30.00%, transparent);
}

@media (max-width: 580px) {
  .ae-body {
    flex-direction: column;
    align-items: center;
  }

  .ae-right {
    margin-top: 20px;
  }

  .ae-paper {
    padding: 30px 20px 30px 35px;
  }
}

  content: '';
  position: absolute;
  z-index: 4;
  pointer-events: none;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 15%,color-mix(in srgb, var(--cxx-red) 8.00%, transparent) 34%,color-mix(in srgb, var(--cxx-red) 75.00%, transparent) 50%,color-mix(in srgb, var(--cxx-cyan) 55.00%, transparent) 53%,transparent 68%);

}

  background-size: 220% 100%;
  animation: cp-alt-flow 12s linear infinite;

.ae-board::after {
  content: '';
  position: absolute;
  z-index: 4;
  pointer-events: none;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 15%,color-mix(in srgb, var(--cxx-red) 8.00%, transparent) 34%,color-mix(in srgb, var(--cxx-red) 75.00%, transparent) 50%,color-mix(in srgb, var(--cxx-cyan) 55.00%, transparent) 53%,transparent 68%);
  background-size: 220% 100%;
  animation: cp-alt-flow 12s linear infinite;
}

.ae-notebook::after {
  content: '';
  position: absolute;
  z-index: 4;
  pointer-events: none;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 15%,color-mix(in srgb, var(--cxx-red) 8.00%, transparent) 34%,color-mix(in srgb, var(--cxx-red) 75.00%, transparent) 50%,color-mix(in srgb, var(--cxx-cyan) 55.00%, transparent) 53%,transparent 68%);
  background-size: 220% 100%;
  animation: cp-alt-flow 12s linear infinite;
}

.ae-container::after {
  content: '';
  position: absolute;
  z-index: 4;
  pointer-events: none;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 15%,color-mix(in srgb, var(--cxx-red) 8.00%, transparent) 34%,color-mix(in srgb, var(--cxx-red) 75.00%, transparent) 50%,color-mix(in srgb, var(--cxx-cyan) 55.00%, transparent) 53%,transparent 68%);
  background-size: 220% 100%;
  animation: cp-alt-flow 12s linear infinite;
}

.ae-journal::after {
  content: '';
  position: absolute;
  z-index: 4;
  pointer-events: none;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,transparent 15%,color-mix(in srgb, var(--cxx-red) 8.00%, transparent) 34%,color-mix(in srgb, var(--cxx-red) 75.00%, transparent) 50%,color-mix(in srgb, var(--cxx-cyan) 55.00%, transparent) 53%,transparent 68%);
  background-size: 220% 100%;
  animation: cp-alt-flow 12s linear infinite;
}

@keyframes cp-alt-flow {
  from {
    background-position: 100% 0;
  }

  to {
    background-position: -100% 0;
  }
}

@media (prefers-reduced-motion:reduce) {
  .ae-wrap * {
    animation-duration: .01ms!important;
    transition-duration: .01ms!important;
  }

  .ae-wrap *::before {
    animation-duration: .01ms!important;
    transition-duration: .01ms!important;
  }

  .ae-wrap *::after {
    animation-duration: .01ms!important;
    transition-duration: .01ms!important;
  }
}

button.ae-btn {
  font-family: inherit;
  line-height: inherit;
  appearance: none;
  min-height: 44px;
}

.ae-btn:focus-visible {
  outline: 2px solid var(--cp-cyan,var(--cxx-line));
  outline-offset: 4px;
}
</style>
