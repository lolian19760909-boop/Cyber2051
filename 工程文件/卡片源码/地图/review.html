<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中心五分区 · 前后对照</title>
<style>:root{color-scheme:dark;font:14px/1.5 system-ui;background:#080e14;color:#c9dadd}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #30424b}h1{font-size:16px;font-weight:500;margin:0 auto 0 0}button,select,a{font:inherit;color:inherit;background:#142229;border:1px solid #425860;padding:8px 12px;border-radius:3px;text-decoration:none;cursor:pointer;min-height:42px}button[aria-pressed=true]{background:#193b3b;border-color:#62aba6}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #ffe1a8;outline-offset:2px}p{font-size:12px;color:#91a6af;padding:5px 16px;margin:0}iframe{flex:1;min-height:0;width:100%;border:0}@media(max-width:650px){header{gap:6px;padding:8px}h1{width:100%}button,select,a{padding:7px}p{padding:5px 8px}}</style>
<header><h1>中心五分区 · 基于 2.0.30</h1><button id="after" aria-pressed="true">五分区</button><button id="before" aria-pressed="false">上版夜景</button><select id="scene" aria-label="查看范围"><option value="core">核心七区</option><option value="north">都北走廊</option><option value="water">滨水区</option><option value="south">新川崎</option><option value="west">西郊野</option><option value="setagaya">世田谷南缘</option><option value="keihin">方舟南缘</option><option value="full">五区总览</option></select><a href="preview.html" target="_blank" rel="noopener">完整双图预览 ↗</a></header>
<p>切换前后保留同一镜头。外围仅在进入后绘制城市；“全域”返回轻量总览。旧地区名称仍可搜索。</p><iframe id="map" title="中心地图对照"></iframe>
<script>
const frame=document.querySelector('#map'),scenes={core:{sectorId:'central-core',camera:{x:2160,y:1350,z:.48},region:'imperial'},north:{sectorId:'north-corridor',camera:{x:2400,y:-530,z:.22},region:'saitama'},water:{sectorId:'waterfront',camera:{x:3630,y:980,z:.19},region:'chiba'},south:{sectorId:'new-kawasaki',camera:{x:1750,y:2400,z:.34},region:'sagami'},west:{sectorId:'west-country',camera:{x:530,y:570,z:.27},region:'kai'},setagaya:{sectorId:'new-kawasaki',camera:{x:1640,y:1840,z:1.5},region:'sagami'},keihin:{sectorId:'central-core',camera:{x:2160,y:1920,z:1.1},region:'keihin'},full:{sectorId:null,camera:{x:2490,y:760,z:.135},region:null}};
let kind='after',saved=null;function load(){frame.src=kind==='after'?'central-preview.html':'baseline/central.html';document.querySelector('#after').setAttribute('aria-pressed',kind==='after');document.querySelector('#before').setAttribute('aria-pressed',kind==='before');}
function scene(){const target=scenes[document.querySelector('#scene').value],v=frame.contentWindow.TOKYO_ATLAS_VIEW.read();v.camera={...target.camera,mode:'flat'};v.sectorId=target.sectorId;v.state.region=target.region;v.state.node=null;v.state.selection=target.region?{kind:'region',id:target.region}:null;v.query='';frame.contentWindow.TOKYO_ATLAS_VIEW.restore(v);}
frame.addEventListener('load',()=>{if(saved){frame.contentWindow.TOKYO_ATLAS_VIEW.restore(saved);saved=null;}else scene();});for(const id of ['after','before'])document.querySelector('#'+id).onclick=()=>{if(kind===id)return;saved=frame.contentWindow.TOKYO_ATLAS_VIEW.read();if(id==='before'&&saved.state.selection?.kind==='region'){const aliases={'central-core':'imperial','north-corridor':'saitama',waterfront:'chiba','new-kawasaki':'sagami','west-country':'kai'};saved.state.region=aliases[saved.state.region]||saved.state.region;saved.state.selection.id=saved.state.region;}kind=id;load();};document.querySelector('#scene').onchange=scene;load();
</script></html>
