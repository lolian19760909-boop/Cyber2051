<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>气泡原稿与接入检查</title><style>
body{margin:20px;background:#17191f;color:#eee;font:16px system-ui}button,select{font:inherit;min-height:44px;padding:8px;margin:3px}#chat.mock{height:auto;min-height:360px;max-width:100%;padding:20px;box-sizing:border-box}.mes_text{container-type:inline-size;width:100%;color:#ebe7e5}.mes{display:block!important;margin:0!important;padding:0!important;max-width:100%!important}.tools{display:flex;flex-wrap:wrap;align-items:center}pre{max-height:360px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#reference{display:block;border:1px solid #666;max-width:100%;height:400px}#helper{display:none}
</style><script src="/bubbles/config.js"></script><script src="/bubbles/purify.js"></script><script src="/bubbles/css.js"></script><script src="/bubbles/showdown.js"></script><script src="/bubbles/sanitize.js"></script></head><body>
<h1>气泡原稿与接入检查</h1><p>两边使用同一段文字、同一占位图片和字体。原稿样式用于对照；接入侧经过本机ST的消息净化函数。</p>
<div class="tools"><button id="compare">运行24组外观对照</button><button id="lifecycle">检查新楼动画与重绘</button><button id="new">增加一条新回复</button><label>主题<select id="theme"><option value="red">红</option><option value="yellow">黄</option><option value="night">夜间</option></select></label><label>宽度<select id="width"><option value="800">桌面</option><option value="350">手机正文</option></select></label><button id="reference-button">显示当前原稿对照</button></div>
<button id="compat">检查后备主题与开关清理</button><output id="status" role="status">正在准备…</output><div id="chat" class="mock" data-theme="red" style="width:800px"></div><iframe id="reference" title="原稿对照" hidden></iframe><div id="tavern_helper"></div><pre id="report"></pre><iframe id="helper" title="助手脚本检查容器"></iframe>
<script type="module" src="/bubbles/fixture.mjs"></script></body></html>
